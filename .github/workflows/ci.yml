name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intel_threat_modeller_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Migrate test database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/intel_threat_modeller_test
        run: pnpm --filter @intel-threat-modeller/api-server run db:migrate

      # Needed before `pnpm test`, not just the frontend e2e step below: api-server's own
      # unit test suite (src/agents/reporting/pdf.test.ts) launches Chromium directly to
      # render a real PDF. Both api-server's `playwright` and frontend's `@playwright/test`
      # resolve to the same pinned version, so one install covers both.
      - name: Install Playwright browser
        run: pnpm --filter @intel-threat-modeller/frontend exec playwright install --with-deps chromium

      - name: Test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/intel_threat_modeller_test
          RUN_LIVE_API_TESTS: "0"
        run: pnpm test

      - name: Frontend e2e (mocked LLM/embeddings fast path)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/intel_threat_modeller_test
          CI: "1"
        run: pnpm --filter @intel-threat-modeller/frontend run e2e

      - name: Smoke e2e (referential integrity across all 3 fixtures)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/intel_threat_modeller_test
        run: pnpm --filter @intel-threat-modeller/api-server run smoke-e2e
